<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<title>Higher / Lower</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0b0e14;
    color: #f2f4f8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overflow: hidden;
  }
  #app {
    height: 100dvh;
    max-width: 540px;
    margin: 0 auto;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 8px env(safe-area-inset-bottom);
  }

  /* ---- header ---- */
  header {
    display: flex; align-items: center; gap: 4px;
    padding: 10px 2px;
    font-size: 19px; font-weight: 800;
  }
  .stat {
    display: flex; align-items: center; gap: 4px;
    background: #161b24; border: 1px solid #29303d;
    border-radius: 14px; padding: 8px 8px;
    min-height: 48px;
  }
  .stat .lbl { font-size: 13px; font-weight: 700; color: #9aa4b6; text-transform: uppercase; letter-spacing: .06em; }
  #modeBtn, #nateBtn, #wernerBtn {
    min-height: 48px; padding: 8px 9px;
    font: inherit; font-size: 16px; font-weight: 800; color: #f2f4f8;
    background: #161b24; border: 1px solid #29303d; border-radius: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  #modeBtn.live { background: #103042; border-color: #2196c9; color: #7fd6ff; }
  #nateBtn, #wernerBtn { min-width: 44px; padding: 8px 6px; }
  #nateBtn.on, #wernerBtn.on { background: #3a2c0e; border-color: #ffc53d; }
  #nateBtn:active, #wernerBtn:active { transform: scale(.96); }
  @media (max-width: 460px) {
    .stat .lbl { display: none; } /* keep all six header controls tappable */
    #modeBtn { font-size: 15px; }
  }
  #newgame {
    margin-left: auto;
    min-height: 48px; padding: 8px 12px;
    font: inherit; font-size: 16px; font-weight: 800; color: #0b0e14;
    background: #f2f4f8; border: none; border-radius: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  #newgame:active, #modeBtn:active { transform: scale(.96); }

  /* ---- win progress ---- */
  #progress {
    position: relative;
    height: 26px;
    background: #161b24; border: 1px solid #29303d;
    border-radius: 13px;
    margin: 0 4px 8px;
    overflow: hidden;
  }
  #progressFill {
    position: absolute; inset: 0 auto 0 0;
    width: 0%;
    background: linear-gradient(90deg, #2f6f4f, #3ddc84);
    transition: width .35s;
  }
  #progressLbl {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 900; color: #ffffff;
    text-shadow: 0 1px 1px rgba(0,0,0,.7);
  }
  #winChance {
    position: absolute; right: 9px; top: 0; bottom: 0;
    display: flex; align-items: center;
    font-size: 13px; font-weight: 900;
    text-shadow: 0 1px 1px rgba(0,0,0,.7);
  }
  #winChance.good { color: #3ddc84; }
  #winChance.mid  { color: #ffc53d; }
  #winChance.bad  { color: #ff6b74; }
  #scoreChip {
    position: absolute; left: 9px; top: 0; bottom: 0;
    display: flex; align-items: center;
    font-size: 13px; font-weight: 900; color: #ffc53d;
    text-shadow: 0 1px 1px rgba(0,0,0,.7);
  }
  .guess .pts { font-size: 12px; font-weight: 800; color: #ffc53d; }
  .guess.best .pts, .guess.armed .pts { color: inherit; }

  /* ---- camera strip (Live mode) ---- */
  #cam {
    position: relative;
    height: 148px;
    margin: 0 4px 8px;
    border-radius: 14px;
    background: #000;
    border: 1px solid #29303d;
    overflow: hidden;
    display: none;
    transition: height .3s;
  }
  #cam.show { display: block; }
  #cam.compact { height: 96px; } /* setup done — give the grid its space back */
  #camVideo, #camOverlay {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }
  #camVideo { object-fit: cover; }
  #camMsg {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    padding: 12px; text-align: center;
    font-size: 15px; font-weight: 700; color: #f2f4f8;
    background: #161b24;
  }
  #camMsg.show { display: flex; }
  .camBtns {
    position: absolute; right: 6px; bottom: 6px;
    display: flex; gap: 6px;
  }
  .camBtns button {
    min-height: 44px; min-width: 44px; padding: 6px 14px;
    font: inherit; font-size: 16px; font-weight: 800; color: #f2f4f8;
    background: rgba(22, 27, 36, .85); border: 1px solid #303a4a; border-radius: 12px;
    cursor: pointer;
  }
  .camBtns button:active { transform: scale(.96); }
  #liveStatus {
    display: none;
    margin: 0 4px 8px;
    padding: 8px 12px;
    border-radius: 12px;
    background: #103042; border: 1px solid #2196c9;
    font-size: 15px; font-weight: 800; color: #aee6ff;
    text-align: center;
  }
  #liveStatus.show { display: block; }

  /* ---- turn strip (2+ players) ---- */
  #turnStrip {
    margin: 0 4px 8px;
    padding: 10px 12px;
    border-radius: 12px;
    background: #161b24; border: 1px solid #29303d;
    font-size: 15px; font-weight: 800;
    text-align: center;
    cursor: pointer;
  }
  #turnStrip b { color: #ffc53d; }
  #turnStrip .nxt { color: #9aa4b6; }

  /* ---- players editor ---- */
  #playersOv {
    position: fixed; inset: 0; z-index: 40;
    display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    background: rgba(11, 14, 20, .96);
    padding: 24px;
  }
  #playersOv.show { display: flex; }
  #playersOv .big { font-size: 30px; font-weight: 900; }
  #playersOv .hint { font-size: 14px; font-weight: 700; color: #9aa4b6; }
  #plist { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 320px; }
  .prow { display: flex; gap: 8px; }
  .prow input {
    flex: 1; min-width: 0;
    min-height: 48px; padding: 8px 12px;
    font: inherit; font-size: 17px; font-weight: 700; color: #f2f4f8;
    background: #161b24; border: 1px solid #303a4a; border-radius: 12px;
    -webkit-user-select: text; user-select: text;
  }
  .prow button, #addPlayer {
    min-width: 48px; min-height: 48px; padding: 8px 14px;
    font: inherit; font-size: 17px; font-weight: 800; color: #f2f4f8;
    background: #1e2530; border: 1px solid #303a4a; border-radius: 12px;
    cursor: pointer;
  }
  #playersDone {
    min-height: 56px; padding: 12px 36px;
    font: inherit; font-size: 20px; font-weight: 900; color: #0b0e14;
    background: #ffc53d; border: none; border-radius: 16px;
    cursor: pointer;
  }
  #playersDone:active, #addPlayer:active { transform: scale(.96); }
  #gameover button.alt {
    background: #1e2530; color: #f2f4f8; border: 1px solid #303a4a;
    font-size: 18px; min-height: 52px; padding: 10px 24px;
  }
  #gameover .row { display: flex; gap: 10px; }
  #gameover .beats { font-size: 16px; color: #9aa4b6; }
  #goBoard {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    max-width: 340px;
  }
  #goBoard .gp {
    padding: 6px 9px;
    border-radius: 9px;
    background: #161b24; border: 1px solid #303a4a;
    font-size: 14px; font-weight: 800;
  }
  #goBoard .gp.red { color: #ff6b74; }
  #goBoard .gp.dead { color: #55617a; background: #10141c; }
  #bestBadge { font-size: 17px; font-weight: 800; color: #9aa4b6; }
  #bestBadge.new { font-size: 22px; font-weight: 900; color: #ffc53d; }

  /* ---- grid ---- */
  #grid {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 8px;
    padding: 2px 0 6px;
  }
  .pile {
    display: flex; flex-direction: column; gap: 5px;
    min-height: 0;
    border-radius: 16px;
  }

  /* card */
  .card {
    flex: 1; min-height: 56px;
    position: relative;
    background: #f7f3e8;
    border-radius: 12px;
    box-shadow: 0 2px 0 #29303d;
    display: flex; align-items: center; justify-content: center;
    transition: box-shadow .25s;
  }
  .card .corner {
    position: absolute; top: 5px; left: 8px;
    font-size: 19px; font-weight: 800; line-height: 1;
    text-align: center;
  }
  .card .pip { font-size: 44px; line-height: 1; }
  .card.red .corner, .card.red .pip { color: #c1121f; }
  .card.blk .corner, .card.blk .pip { color: #14181f; }
  .card .count {
    position: absolute; right: 6px; bottom: 5px;
    font-size: 13px; font-weight: 800; color: #f7f3e8;
    background: #14181f;
    border-radius: 9px; padding: 2px 7px;
  }
  /* stack-depth hint */
  .card::before, .card::after {
    content: ""; position: absolute; left: 3px; right: 3px;
    height: 3px; background: #d8d2c2; border-radius: 2px;
  }
  .card::before { bottom: -4px; }
  .card::after  { bottom: -8px; opacity: .5; }
  .card.h1::before, .card.h1::after { display: none; }
  .card.h2::after { display: none; }

  /* face-down pile (Nate mode) — tap to flip */
  .card.back {
    background: #1d2b4a repeating-linear-gradient(135deg, rgba(255,255,255,.07) 0 6px, transparent 6px 12px);
    cursor: pointer;
  }
  .card.back::before, .card.back::after { display: none; }
  .card.back .pip { color: #7f96c9; font-size: 36px; }
  .card.back:active { transform: scale(.97); }

  /* blind guess buttons (Nate mode): arrows only, no odds */
  .guess.blind .arrow { font-size: 26px; }

  /* locked out by a Werner ride: odds stay readable, taps do nothing */
  .guess.off { opacity: .4; }
  .guess.off:active { transform: none; }

  /* empty slot during Live setup */
  .card.empty {
    background: transparent;
    border: 2px dashed #303a4a;
    box-shadow: none;
    color: #55617a;
    font-size: 26px; font-weight: 900;
  }
  .card.empty::before, .card.empty::after { display: none; }

  /* guess buttons */
  .btns { display: flex; flex-direction: column; gap: 5px; }
  .guess {
    min-height: 52px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font: inherit; font-size: 19px; font-weight: 900; color: #ffffff;
    background: #1e2530; border: 1px solid #303a4a; border-radius: 12px;
    cursor: pointer;
  }
  .guess:active { transform: scale(.96); }
  .guess .arrow { font-size: 16px; }
  .guess.best {
    background: #ffc53d; border-color: #ffc53d; color: #14181f;
  }
  .guess.armed {
    background: #2196c9; border-color: #7fd6ff; color: #04141d;
  }

  /* recommended pile pulse */
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 2px #ffc53d, 0 0 10px 2px rgba(255,197,61,.55); }
    50%      { box-shadow: 0 0 0 3px #ffc53d, 0 0 26px 8px rgba(255,197,61,.85); }
  }
  .pile.rec .card { animation: pulse 1.2s ease-in-out infinite; }

  /* landing card flip + pile-death shake (guarded for reduced motion) */
  @media (prefers-reduced-motion: no-preference) {
    @keyframes flipin { from { transform: rotateY(88deg); } to { transform: rotateY(0); } }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px) rotate(-2deg); }
      40% { transform: translateX(5px) rotate(2deg); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(3px); }
    }
    .pile.landed .card { animation: flipin .35s ease-out; }
    .pile.rec.landed .card { animation: flipin .35s ease-out, pulse 1.2s ease-in-out .35s infinite; }
    .pile.died .card { animation: shake .45s ease-in; }
  }

  /* streak flame: grows with the multiplier */
  .card .flame {
    position: absolute; left: 6px; bottom: 4px;
    font-weight: 900; color: #ff9d2e; line-height: 1;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .pile.armed .card { box-shadow: 0 0 0 3px #2196c9, 0 0 18px 4px rgba(33,150,201,.7); animation: none; }

  /* dead pile */
  .pile.dead .card {
    background: #171c25;
    box-shadow: none;
  }
  .pile.dead .card::before, .pile.dead .card::after { background: #232a36; }
  .pile.dead .card .corner { color: #4a5468; }
  .pile.dead .card .pip { visibility: hidden; }
  .pile.dead .card .count { background: #232a36; color: #6b7689; }
  .pile.dead .card .x {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 800; color: #55617a;
  }
  .pile.dead .btns { visibility: hidden; }

  /* win flash */
  .pile.won .card { box-shadow: 0 0 0 3px #3ddc84, 0 0 22px 4px rgba(61,220,132,.8); }

  /* ---- footer rules line ---- */
  footer {
    padding: 4px 48px 8px;
    font-size: 13px; font-weight: 700; color: #9aa4b6;
    text-align: center;
  }
  #muteBtn {
    position: fixed; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 8px);
    z-index: 10;
    width: 42px; height: 42px;
    font-size: 18px;
    background: rgba(22, 27, 36, .9); border: 1px solid #303a4a; border-radius: 50%;
    color: #f2f4f8; cursor: pointer;
  }
  #muteBtn.muted { opacity: .5; }
  #muteBtn:active { transform: scale(.94); }

  /* ---- drink toast ---- */
  #toast {
    position: fixed; inset: 0; z-index: 20;
    display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 10px;
    background: rgba(178, 16, 32, .94);
    text-align: center;
  }
  #toast.show { display: flex; }
  #toast .big { font-size: 64px; font-weight: 900; letter-spacing: .01em; }
  #toast .sub { font-size: 22px; font-weight: 700; }
  #toast img {
    max-width: 78vw; max-height: 36vh;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,.55);
  }
  /* tie: same drink, but the whole screen goes yellow and the pile lives */
  #toast.tie { background: rgba(255, 197, 61, .96); }
  #toast.tie .big, #toast.tie .sub { color: #14181f; }

  /* card-read flash (Live mode) */
  #readFlash {
    position: fixed; left: 50%; top: 18%; z-index: 15;
    transform: translateX(-50%);
    display: none;
    padding: 10px 22px;
    border-radius: 16px;
    background: #103042; border: 2px solid #7fd6ff;
    font-size: 30px; font-weight: 900; color: #ffffff;
    white-space: nowrap; max-width: 94vw; overflow: hidden;
  }
  #readFlash.show { display: block; }
  #readFlash .red { color: #ff6b74; }

  /* ---- game over ---- */
  #gameover {
    position: fixed; inset: 0; z-index: 30;
    display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 18px;
    background: rgba(11, 14, 20, .96);
    text-align: center; padding: 24px;
  }
  #gameover.show { display: flex; }
  #confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #gameover img {
    max-width: 78vw; max-height: 38vh;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,.55);
  }
  #gameover .cap { font-size: 26px; font-weight: 900; color: #ffc53d; }
  #gameover .big { font-size: 40px; font-weight: 900; }
  #gameover .sub { font-size: 20px; font-weight: 700; color: #aeb7c6; line-height: 1.6; }
  #gameover button {
    min-height: 64px; padding: 14px 40px;
    font: inherit; font-size: 24px; font-weight: 900; color: #0b0e14;
    background: #ffc53d; border: none; border-radius: 18px;
    cursor: pointer;
  }
  #gameover button:active { transform: scale(.96); }

  @media (max-height: 700px) {
    .card .pip { font-size: 32px; }
    .guess { min-height: 44px; font-size: 17px; }
    header { font-size: 19px; }
    #cam { height: 110px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stat"><span class="lbl">Deck</span><span id="deckCount">–</span></div>
    <div class="stat" id="drinkStat" title="Your session drinks — tap to manage players" style="cursor:pointer">🍺<span id="drinkCount">0</span></div>
    <button id="modeBtn" title="Toggle camera Live mode">📷 Live</button>
    <button id="nateBtn" title="Nate mode: face-down deal, flip to play, triple win bonus">😎</button>
    <button id="wernerBtn" title="Wacky Werner: once you guess a pile you're stuck with it until it busts">🤪</button>
    <button id="newgame">New</button>
  </header>
  <div id="progress"><div id="progressFill"></div><span id="progressLbl"></span><span id="scoreChip"></span><span id="winChance"></span></div>
  <div id="cam">
    <video id="camVideo" playsinline muted></video>
    <canvas id="camOverlay"></canvas>
    <div id="camMsg"></div>
    <div class="camBtns">
      <button id="torchBtn" hidden>🔦</button>
      <button id="undoBtn">↩ Undo</button>
    </div>
  </div>
  <div id="liveStatus"></div>
  <div id="turnStrip" hidden></div>
  <main id="grid"></main>
  <footer id="rules">▲/▼ on any live pile · wrong = drink the pile &amp; it dies · tie = drink, pile lives · Ace high</footer>
</div>

<button id="muteBtn" title="Sound &amp; vibration">🔊</button>

<div id="readFlash"></div>
<div id="toast"><img id="toastImg" alt="" hidden><div class="big"></div><div class="sub"></div></div>

<div id="gameover">
  <canvas id="confetti"></canvas>
  <img id="goImg" alt="" hidden>
  <div class="cap" id="goCap" hidden></div>
  <div class="big"></div>
  <div id="bestBadge" hidden></div>
  <div class="sub"></div>
  <div id="goBoard"></div>
  <button id="again">New game</button>
  <div class="row">
    <button id="editPlayers" class="alt">👥 Players</button>
    <button id="shareBtn" class="alt">📤 Share</button>
  </div>
</div>

<div id="playersOv">
  <div class="big">👥 Players</div>
  <div class="hint">pass-and-play · turns rotate after every guess</div>
  <div id="plist"></div>
  <button id="addPlayer">+ Add player</button>
  <button id="playersDone">Deal 'em in</button>
</div>

<script id="engine">
// Pure game engine — no DOM. Kept DOM-free so it can be evaluated under Node for tests.
const Engine = (() => {
  const SUITS = ['♠', '♥', '♦', '♣'];
  const RED = { '♥': true, '♦': true };
  const LABELS = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A' };
  const PILES = 9;

  function label(rank) { return LABELS[rank] || String(rank); }
  function key(card) { return label(card.rank) + card.suit; }

  function fullDeck() {
    const deck = [];
    for (const suit of SUITS) {
      for (let rank = 2; rank <= 14; rank++) deck.push({ rank, suit });
    }
    return deck;
  }

  // Pass-and-play roster; solo defaults to a single anonymous player.
  function mkPlayers(names) {
    const list = names && names.length ? names : ['You'];
    return list.slice(0, 8).map(n => ({ name: n, drinks: 0, score: 0 }));
  }

  // nate=true deals every pile face-down: it must be flipped before it can be
  // played, and nothing about its card is shown until then.
  // werner=true is Wacky Werner: once you guess on a pile you're locked to it
  // until it busts (state.lock is the pile you're riding, -1 = free choice).
  // names is the pass-and-play roster; turns rotate after every resolved guess.
  function newGame(rng, nate, werner, names) {
    rng = rng || Math.random;
    const deck = fullDeck();
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    const piles = [];
    for (let i = 0; i < PILES; i++) piles.push({ cards: [deck.pop()], alive: true, revealed: !nate });
    return { deck, piles, drinks: 0, over: false, reason: null,
             nate: !!nate, werner: !!werner, lock: -1,
             players: mkPlayers(names), turn: 0,
             stats: { ties: 0, badBreaks: 0, closeWins: 0 },
             score: 0, streak: { pile: -1, n: 0 }, bonus: null };
  }

  // Nate mode: reveal a face-down pile so it can be played.
  function flip(state, i) {
    const pile = state.piles[i];
    if (state.over || !pile.alive || pile.revealed) return false;
    pile.revealed = true;
    return true;
  }

  // Exact clean-win odds from the remaining deck's known composition.
  // Ties excluded from both: a tie still costs a drink (but the pile survives).
  // Works for both modes — in Live mode state.deck is the not-yet-seen multiset.
  function probs(state, i) {
    const top = state.piles[i].cards[state.piles[i].cards.length - 1];
    let higher = 0, lower = 0;
    for (const c of state.deck) {
      if (c.rank > top.rank) higher++;
      else if (c.rank < top.rank) lower++;
    }
    const n = state.deck.length || 1;
    return { higher: higher / n, lower: lower / n };
  }

  // Monte Carlo estimate of winning from here: shuffle the remaining/unseen
  // cards and replay the rest of the game under recommended (greedy) play.
  // Rank counts only, so rollouts are cheap. Deterministic for a given
  // position — the rng is seeded from the state — so re-renders don't jitter.
  function winChance(state, n, rng) {

      const [x, y] = dst[i], [X, Y] = src[i];
      A.push([x, y, 1, 0, 0, 0, -x * X, -y * X, X]);
      A.push([0, 0, 0, x, y, 1, -x * Y, -y * Y, Y]);
    }
    // gaussian elimination, 8 unknowns
    for (let c = 0; c < 8; c++) {
      let piv = c;
      for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[piv][c])) piv = r;
      if (Math.abs(A[piv][c]) < 1e-9) return null;
      [A[c], A[piv]] = [A[piv], A[c]];
      for (let r = 0; r < 8; r++) {
        if (r === c) continue;
        const f = A[r][c] / A[c][c];
        for (let k = c; k < 9; k++) A[r][k] -= f * A[c][k];
      }
    }
    const hv = [];
    for (let i = 0; i < 8; i++) hv.push(A[i][8] / A[i][i]);
    hv.push(1);
    return hv;
  }

  // Orient quad so the card comes out portrait, then inverse-warp RGB.
  function warpCard(data, w, h, quad) {
    let q = quad.slice();
    if (dist(q[0], q[1]) > dist(q[1], q[2])) q = [q[1], q[2], q[3], q[0]]; // landscape -> rotate
    const H = solveH(q);
    if (!H) return null;
    const out = new Uint8ClampedArray(CW * CH * 4);
    for (let y = 0; y < CH; y++) {
      for (let x = 0; x < CW; x++) {
        const d = H[6] * x + H[7] * y + H[8];
        const sx = Math.round((H[0] * x + H[1] * y + H[2]) / d);
        const sy = Math.round((H[3] * x + H[4] * y + H[5]) / d);
        const o = (y * CW + x) * 4;
        if (sx >= 0 && sy >= 0 && sx < w && sy < h) {
          const p = (sy * w + sx) * 4;
          out[o] = data[p]; out[o + 1] = data[p + 1]; out[o + 2] = data[p + 2]; out[o + 3] = 255;
        } else { out[o + 3] = 255; }
      }
    }
    return { data: out, width: CW, height: CH };
  }

  // Normalize a glyph mask (bbox region of a binary image) to GWxGH bits.
  function normalizeBits(mask, mw, x0, y0, x1, y1) {
    const bits = new Uint8Array(GW * GH);
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
    for (let gy = 0; gy < GH; gy++) {
      for (let gx = 0; gx < GW; gx++) {
        const sx0 = x0 + Math.floor(gx * bw / GW), sx1 = x0 + Math.max(Math.floor((gx + 1) * bw / GW) - 1, Math.floor(gx * bw / GW));
        const sy0 = y0 + Math.floor(gy * bh / GH), sy1 = y0 + Math.max(Math.floor((gy + 1) * bh / GH) - 1, Math.floor(gy * bh / GH));
        let on = 0, n = 0;
        for (let sy = sy0; sy <= sy1; sy++) for (let sx = sx0; sx <= sx1; sx++) { on += mask[sy * mw + sx]; n++; }
        bits[gy * GW + gx] = on / n >= 0.4 ? 1 : 0;
      }
    }
    return bits;
  }

  function matchBits(a, b) {
    let same = 0;
    for (let i = 0; i < a.length; i++) if (a[i] === b[i]) same++;
    return same / a.length;
  }

  function bestMatch(bits, tmplSets) {
    let best = null;
    for (const label in tmplSets) {
      for (const t of tmplSets[label]) {
        const s = matchBits(bits, t);
        if (!best || s > best.score) best = { label, score: s };
      }
    }
    return best;
  }

  // Read the index corner of a warped card. rot=true reads the opposite corner
  // 180°-rotated (covers an upside-down warp).
  function readCorner(card, rot) {
    const SW = 54, SH = 128; // corner strip
    const px = (x, y) => {
      const rx = rot ? CW - 1 - x : x, ry = rot ? CH - 1 - y : y;
      return (ry * CW + rx) * 4;
    };
    // strip grayscale + dark threshold (glyphs are dark on the white face)
    const g = new Uint8Array(SW * SH);
    for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) {
      const p = px(x, y);
      g[y * SW + x] = (card.data[p] * 3 + card.data[p + 1] * 4 + card.data[p + 2]) >> 3;
    }
    const th = otsu(g);
    const mask = new Uint8Array(SW * SH);
    let dark = 0, darkSum = 0, brightSum = 0;
    for (let i = 0; i < mask.length; i++) {
      if (g[i] <= th) { mask[i] = 1; dark++; darkSum += g[i]; }
      else brightSum += g[i];
    }
    const frac = dark / mask.length;
    if (frac < 0.005 || frac > 0.5) return null; // no glyph-sized dark content
    // demand real contrast between glyph and card face
    if (brightSum / (mask.length - dark) - darkSum / dark < 50) return null;
    let blobs = components((x, y) => mask[y * SW + x] === 1, SW, SH)
      .filter(b => b.area >= 25 && b.x0 > 0 && b.y0 > 0 && b.x1 < SW - 1 && b.y1 < SH - 1);
    if (!blobs.length) return null;
    blobs.sort((a, b) => a.y0 - b.y0);
    // group blobs sharing a vertical band: '1'+'0' of a 10 belong together
    const groups = [];
    for (const b of blobs) {
      const grp = groups.find(gp => Math.min(gp.y1, b.y1) - Math.max(gp.y0, b.y0) > 0.5 * Math.min(gp.y1 - gp.y0, b.y1 - b.y0));
      if (grp) {
        grp.x0 = Math.min(grp.x0, b.x0); grp.y0 = Math.min(grp.y0, b.y0);
        grp.x1 = Math.max(grp.x1, b.x1); grp.y1 = Math.max(grp.y1, b.y1);
        grp.area += b.area;
      } else groups.push({ x0: b.x0, y0: b.y0, x1: b.x1, y1: b.y1, area: b.area });
    }
    if (groups.length < 2) return null; // need rank + suit
    // topmost band is the rank; everything below it is the suit glyph (which can
    // split into blobs — e.g. a club's stem disconnects from its lobes)
    const rankG = groups[0];
    const suitG = groups.slice(1).reduce((a, b) => ({
      x0: Math.min(a.x0, b.x0), y0: Math.min(a.y0, b.y0),
      x1: Math.max(a.x1, b.x1), y1: Math.max(a.y1, b.y1),
      area: a.area + b.area,
    }));
    const T = templates();
    const rank = bestMatch(normalizeBits(mask, SW, rankG.x0, rankG.y0, rankG.x1, rankG.y1), T.ranks);
    if (!rank) return null;
    // color first (red/black from the suit glyph's pixels), then shape-match
    // only against that color's two suits
    let r = 0, gb = 0, n = 0;
    for (let y = suitG.y0; y <= suitG.y1; y++) for (let x = suitG.x0; x <= suitG.x1; x++) {
      if (!mask[y * SW + x]) continue;
      const p = px(x, y);
      r += card.data[p]; gb += (card.data[p + 1] + card.data[p + 2]) / 2; n++;
    }
    const isRed = n > 0 && (r - gb) / n > 22;
    const pool = {};
    for (const s of isRed ? ['♥', '♦'] : ['♠', '♣']) pool[s] = T.suits[s];
    const suitShape = bestMatch(normalizeBits(mask, SW, suitG.x0, suitG.y0, suitG.x1, suitG.y1), pool);
    if (!suitShape) return null;
    const score = Math.min(rank.score, suitShape.score);
    return { rank: rank.label, suit: suitShape.label, score };
  }

  const MIN_SCORE = 0.82;

  function readCard(card) {
    const a = readCorner(card, false);
    const b = readCorner(card, true);
    const good = [a, b].filter(r => r && r.score >= MIN_SCORE);
    if (!good.length) return null;
    if (good.length === 2 && (good[0].rank !== good[1].rank || good[0].suit !== good[1].suit)) return null;
    return good.sort((x, y) => y.score - x.score)[0];
  }

  // Full pipeline on one RGBA frame. Returns {quad, read} (either may be null).
  function detect(data, w, h) {
    const STEP = 2;
    const { g, gw, gh } = grayDown(data, w, h, STEP);
    const q = findCardQuad(g, gw, gh);
    if (!q) return { quad: null, read: null };
    const quad = q.map(([x, y]) => [x * STEP, y * STEP]);
    const card = warpCard(data, w, h, quad);
    if (!card) return { quad, read: null };
    return { quad, read: readCard(card) };
  }

  // Whole-table pipeline: every card in the frame, as [{quad, read}] in
  // row-major order (top-left first) so pile numbering mirrors the table.
  function detectAll(data, w, h) {
    const STEP = 2;
    const { g, gw, gh } = grayDown(data, w, h, STEP);
    const found = findCardQuads(g, gw, gh).slice(0, 12).map(q => {
      const quad = q.map(([x, y]) => [x * STEP, y * STEP]);
      const card = warpCard(data, w, h, quad);
      return { quad, read: card ? readCard(card) : null };
    });
    const cx = (o) => (o.quad[0][0] + o.quad[1][0] + o.quad[2][0] + o.quad[3][0]) / 4;
    const cy = (o) => (o.quad[0][1] + o.quad[1][1] + o.quad[2][1] + o.quad[3][1]) / 4;
    found.sort((a, b) => cy(a) - cy(b));
    // band into rows: same row while vertical centers sit within half a card
    // height, so slightly skewed layouts still read left-to-right
    const rows = [];
    for (const o of found) {
      const hgt = dist(o.quad[0], o.quad[3]);
      const last = rows[rows.length - 1];
      if (last && cy(o) - last.y < hgt * 0.5) {
        last.items.push(o);
        last.y += (cy(o) - last.y) / last.items.length;
      } else {
        rows.push({ y: cy(o), items: [o] });
      }
    }
    for (const r of rows) r.items.sort((a, b) => cx(a) - cx(b));
    return rows.flatMap(r => r.items);
  }

  return { detect, detectAll, readCard, readCorner, warpCard, solveH, otsu, components,
           findCardQuad, findCardQuads, normalizeBits, matchBits, hexToBits, grayDown,
           TEMPLATES, CW, CH, GW, GH, MIN_SCORE };
})();
if (typeof module !== 'undefined') module.exports.Vision = Vision;

<script id="ui">
(() => {
  const $ = (sel) => document.querySelector(sel);
  const grid = $('#grid');
  const toast = $('#toast');
  const ASSETS = window.GAME_ASSETS || { win: '', lose: '' };
  // punishment photo pool: the tongue and the kid are the staples,
  // the Trapped in the Closet DVDs and the cat kiss are rare pulls
  const DRINK_POOL = [
    [ASSETS.lose, 35], [ASSETS.kid, 35], [ASSETS.closet, 15], [ASSETS.cat, 15],
  ].filter(e => e[0]);
  function drinkPic(sips) {
    // busting a 6+ tower usually earns the kid with the can stack
    if (sips >= 6 && ASSETS.stack && Math.random() < 0.7) return ASSETS.stack;
    let r = Math.random() * DRINK_POOL.reduce((n, e) => n + e[1], 0);
    for (const e of DRINK_POOL) if ((r -= e[1]) < 0) return e[0];
    return ASSETS.lose;
  }

  let mode = 'play';                 // 'play' (virtual deck) | 'live' (camera)
  let nate = false;                  // face-down deal, no odds, triple win bonus
  let werner = false;                // stuck with a pile until it busts
  let roster = ['You'];              // pass-and-play names; 1 = solo (no turn UI)
  let vState = Engine.newGame();
  let lState = null;
  let armed = null;                  // {pile, dir} awaiting a physical card (live)
  let sessionDrinks = {};            // per-name; survives New game, dies with the tab
  let locked = false;                // swallow taps while the drink toast is up

  // ---- sound & haptics: everything synthesized, no audio assets ----
  const Sfx = (() => {
    let ctx = null, muted = false;
    try { muted = localStorage.getItem('hl.muted') === '1'; } catch (_) {}
    function ac() { // lazily created inside user-gesture call stacks (autoplay rules)
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
      }
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      return ctx;
    }
    function tone(freq, t0, dur, type, gain) {
      const c = ac();
      if (!c) return;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type;
      o.frequency.value = freq;
      const at = c.currentTime + t0;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(gain, at + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      o.connect(g).connect(c.destination);
      o.start(at); o.stop(at + dur + 0.05);
    }
    const buzz = (p) => { if (navigator.vibrate) try { navigator.vibrate(p); } catch (_) {} };
    return {
      get muted() { return muted; },
      toggle() {
        muted = !muted;
        try { localStorage.setItem('hl.muted', muted ? '1' : '0'); } catch (_) {}
        return muted;
      },
      win(streak) { // ding that climbs with the streak
        if (!muted) {
          const f = 660 * Math.pow(1.12, Math.min(streak || 1, 8) - 1);
          tone(f, 0, 0.12, 'triangle', 0.15);
          tone(f * 1.5, 0.07, 0.15, 'triangle', 0.12);
        }
        buzz(30);
      },
      bust() {
        if (!muted) { tone(220, 0, 0.25, 'sawtooth', 0.2); tone(150, 0.12, 0.35, 'sawtooth', 0.2); }
        buzz([400]);
      },
      tie() {
        if (!muted) { tone(330, 0, 0.12, 'square', 0.12); tone(330, 0.16, 0.12, 'square', 0.12); }
        buzz([80, 60, 80]);
      },
      fanfare() {
        if (!muted) [523, 659, 784, 1047].forEach((f, k) => tone(f, k * 0.12, 0.22, 'triangle', 0.16));
        buzz([60, 40, 60, 40, 120]);
      },
      flip() { if (!muted) tone(880, 0, 0.05, 'square', 0.06); },
    };
  })();

  const cur = () => (mode === 'live' ? lState : vState);
  const pct = (p) => Math.round(p * 100) + '%';
  const SITE = 'https://toby-semaphorepartners.github.io/higher-lower/';

  // ---- device-local best scores, keyed by mode combo ----
  const modeKey = (state) => state.live ? 'live'
    : [state.nate ? 'nate' : '', state.werner ? 'werner' : ''].filter(Boolean).join('+') || 'normal';
  const Best = {
    load() { try { return JSON.parse(localStorage.getItem('hl.best')) || {}; } catch (_) { return {}; } },
    get(k) { return Best.load()[k] || 0; },
    set(k, v) {
      try {
        const m = Best.load();
        m[k] = v;
        localStorage.setItem('hl.best', JSON.stringify(m));
      } catch (_) {}
    },
  };
  const esc = (s) => String(s).replace(/[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function cardFace(pile, idx) {
    if (!pile.cards.length) return `<div class="card empty">${idx + 1}</div>`;
    if (!pile.revealed) return `<div class="card back" data-flip="${idx}"><div class="pip">?</div></div>`;
    const top = pile.cards[pile.cards.length - 1];
    const color = Engine.RED[top.suit] ? 'red' : 'blk';
    const height = pile.cards.length >= 3 ? 'h3' : 'h' + pile.cards.length;
    // streak flame: this pile is hot — shows the multiplier the next win pays
    const st = cur();
    const flame = pile.alive && st.streak && st.streak.pile === idx && st.streak.n > 0
      ? `<div class="flame" style="font-size:${13 + Math.min(st.streak.n, 6) * 2}px">🔥×${(1 + 0.5 * st.streak.n).toFixed(1).replace(/\.0$/, '')}</div>`
      : '';
    return `<div class="card ${color} ${height}">
      <div class="corner">${Engine.label(top.rank)}<br>${top.suit}</div>
      <div class="pip">${top.suit}</div>
      ${pile.alive ? '' : '<div class="x">✕</div>'}
      ${flame}
      <div class="count">×${pile.cards.length}</div>
    </div>`;
  }

  function render(fx) {
    const state = cur();
    const setup = mode === 'live' && state.phase === 'setup';
    const rec = state.over || setup || state.nate ? null : Engine.recommend(state);
    grid.innerHTML = state.piles.map((pile, i) => {
      const isRec = rec && rec.pile === i;
      const isArmed = armed && armed.pile === i;
      const cls = ['pile', pile.alive ? '' : 'dead', isRec && !armed ? 'rec' : '',
                   isArmed ? 'armed' : '',
                   fx && fx.pile === i && fx.win ? 'won' : '',
                   fx && fx.pile === i && fx.anim && !fx.dead ? 'landed' : '',
                   fx && fx.pile === i && fx.dead ? 'died' : ''].join(' ');
      let btns = '';
      // Werner: while you're riding another pile these buttons grey out —
      // still showing their odds — and won't take a tap until yours busts
      const lockOut = state.werner && state.lock >= 0 && state.lock !== i;
      const off = lockOut ? ' off' : '';
      const dis = lockOut ? 'disabled' : '';
      if (!setup && pile.cards.length && pile.revealed && state.nate) {
        // Nate mode: arrows only — odds or payouts would give the cards away
        btns = `<div class="btns">
          <button class="guess blind${off}" ${dis} data-i="${i}" data-dir="higher"><span class="arrow">▲</span></button>
          <button class="guess blind${off}" ${dis} data-i="${i}" data-dir="lower"><span class="arrow">▼</span></button>
        </div>`;
      } else if (!setup && pile.cards.length && pile.revealed) {
        const p = Engine.probs(state, i);
        // potential payout preview: odds × height-after-win × live streak bonus
        const sn = state.streak && state.streak.pile === i ? state.streak.n : 0;
        const pot = (prob) => Math.round(100 * (1 - prob) * (pile.cards.length + 1) * (1 + 0.5 * sn));
        // an exact 50/50 recommendation is an honest coin flip — mark it 🪙
        const coin = (d) => isRec && !armed && rec.flip && rec.dir === d ? '🪙' : '';
        btns = `<div class="btns">
          <button class="guess ${isArmed && armed.dir === 'higher' ? 'armed' : isRec && !armed && rec.dir === 'higher' ? 'best' : ''}${off}" ${dis} data-i="${i}" data-dir="higher">
            <span class="arrow">${coin('higher')}▲</span>${pct(p.higher)}<span class="pts">+${pot(p.higher)}</span></button>
          <button class="guess ${isArmed && armed.dir === 'lower' ? 'armed' : isRec && !armed && rec.dir === 'lower' ? 'best' : ''}${off}" ${dis} data-i="${i}" data-dir="lower">
            <span class="arrow">${coin('lower')}▼</span>${pct(p.lower)}<span class="pts">+${pot(p.lower)}</span></button>
        </div>`;
      }
      return `<div class="${cls}" data-i="${i}">${cardFace(pile, i)}${btns}</div>`;
    }).join('');
    const curPlayer = state.players[state.turn];
    $('#deckCount').textContent = state.deck.length;
    $('#drinkCount').textContent = sessionDrinks[curPlayer.name] || 0;
    // turn strip only when it's actually a rotation (2+ players)
    const ts = $('#turnStrip');
    if (state.players.length > 1 && !state.over && !(mode === 'live' && state.phase === 'setup')) {
      const nxt = state.players[(state.turn + 1) % state.players.length];
      ts.hidden = false;
      ts.innerHTML = `▶ <b>${esc(curPlayer.name)}</b> guesses <span class="nxt">· next: ${esc(nxt.name)}</span>`;
    } else {
      ts.hidden = true;
    }
    // win = surviving until the deck runs out; progress = draw deck consumed
    if (setup) {
      const scanned = state.piles.filter(p => p.cards.length).length;
      $('#progressFill').style.width = '0%';
      $('#progressLbl').textContent = `setting up · scan starting card ${scanned + 1} of 9`;
    } else {
      const total = 43, left = state.deck.length;
      const pctDone = Math.round(((total - left) / total) * 100);
      $('#progressFill').style.width = pctDone + '%';
      $('#progressLbl').textContent = state.over && state.reason === 'deck'
        ? 'deck cleared 🎉'
        : `${left} card${left === 1 ? '' : 's'} left · ${pctDone}% to victory`;
    }
    const wc = $('#winChance');
    if (setup) {
      wc.textContent = '';
    } else if (state.nate && !state.over) {
      wc.textContent = 'win ?%'; // the estimate would leak what's face down
      wc.className = 'mid';
    } else {
      const p = Engine.winChance(state);
      wc.textContent = `win ${Math.round(p * 100)}%`;
      wc.className = p >= 0.5 ? 'good' : p >= 0.25 ? 'mid' : 'bad';
    }
    $('#scoreChip').textContent = setup ? '' : `${curPlayer.score} pts`;
    $('#cam').classList.toggle('compact', mode === 'live' && state.phase === 'play');
    renderLiveStatus();
  }

  function renderLiveStatus() {
    const el = $('#liveStatus');
    if (mode !== 'live') { el.classList.remove('show'); return; }
    el.classList.add('show');
    const state = cur();
    const who = state.players.length > 1 ? state.players[state.turn].name + ': ' : '';
    if (state.over) el.textContent = 'game over — Undo or New game';
    else if (state.phase === 'setup') el.textContent = '📷 lay the starting cards in view — it scans them all';
    else if (armed) el.textContent = `${who}${armed.dir === 'higher' ? '▲' : '▼'} armed on pile ${armed.pile + 1} — flip the card`;
    else el.textContent = `${who}tap ▲/▼ on a pile, then flip the next card`;
  }

  function showToast(sips, tie, name) {
    toast.classList.toggle('tie', !!tie);
    const img = $('#toastImg');
    // tie = kissing your sister; a real loss pulls from the punishment pool
    img.hidden = tie ? !ASSETS.kiss : !DRINK_POOL.length;
    if (!img.hidden) img.src = tie ? ASSETS.kiss : drinkPic(sips);
    toast.querySelector('.big').textContent =
      name ? `${name.toUpperCase()} DRINKS ${sips} 🍺` : `DRINK ${sips} 🍺`;
    toast.querySelector('.sub').textContent = tie ? 'tie — you live' : 'pile is dead';
    toast.classList.add('show');
    locked = true;
    setTimeout(() => {
      toast.classList.remove('show');
      locked = false;
      maybeGameOver();
    }, 1400);
  }

  let readTimer = null;
  function flashRead(card, note) {
    const el = $('#readFlash');
    const red = Engine.RED[card.suit];
    el.innerHTML = `<span class="${red ? 'red' : ''}">${Engine.label(card.rank)}${card.suit}</span>${note ? ' ' + note : ''}`;
    el.classList.add('show');
    clearTimeout(readTimer);
    readTimer = setTimeout(() => el.classList.remove('show'), 1400);
  }

  function maybeGameOver() {
    const state = cur();
    if (!state.over) return;
    const win = state.reason === 'deck';
    const already = $('#gameover').classList.contains('show');
    if (win && !already) Sfx.fanfare();
    if (win && !already) setTimeout(confetti, 60); // after the overlay lays out
    if (!already) {
      // best score for this mode combo — the table's top player sets the mark
      const k = modeKey(state);
      const top = Math.max(...state.players.map(p => p.score));
      const prev = Best.get(k);
      const isNew = top > prev;
      if (isNew) Best.set(k, top);
      const bb = $('#bestBadge');
      bb.hidden = false;
      bb.classList.toggle('new', isNew);
      bb.textContent = isNew
        ? `NEW BEST 🎉 ${top} pts${prev ? ` (was ${prev})` : ''}`
        : `best${k === 'normal' ? '' : ' ' + k} score: ${prev} pts`;
    }
    $('#goImg').src = win ? ASSETS.win : drinkPic(0);
    $('#goImg').hidden = !(win ? ASSETS.win : DRINK_POOL.length);
    $('#goCap').textContent = 'Chillin';
    $('#goCap').hidden = !win;
    $('#gameover .big').textContent = state.reason === 'deck' ? 'Deck done 🎉' : 'All piles dead 💀';
    const b = state.bonus || { untouched: 0, win: 0 };
    const bonusTxt = (b.untouched ? ` (+${b.untouched} untouched)` : '') + (b.win ? ` (+${b.win} clear)` : '');
    // post-game stats: how close it was, plus the game's story beats
    const s = state.stats || { ties: 0, badBreaks: 0, closeWins: 0 };
    const n = (v, w) => `${v} ${w}${v === 1 ? '' : 's'}`;
    const beats = [];
    if (s.closeWins) beats.push(`⚡ ${n(s.closeWins, 'close win')}`);
    if (s.ties) beats.push(`💋 ${n(s.ties, 'tie')}`);
    if (s.badBreaks) beats.push(`💔 ${n(s.badBreaks, 'bad break')}`);
    let statsTxt = '';
    if (!win) statsTxt += `<br><b>${n(state.deck.length, 'card')}</b> from victory`;
    const standing = state.piles.filter(pl => pl.alive && pl.cards.length).length;
    if (standing) statsTxt += `<br>🂠 ${n(standing, 'stack')} still standing`;
    if (beats.length) statsTxt += `<br><span class="beats">${beats.join(' · ')}</span>`;
    // the final board: every stack as it ended (face-down piles get revealed —
    // the game is over, seeing what you never flipped is part of the story)
    $('#goBoard').innerHTML = state.piles.map(pl => {
      if (!pl.cards.length) return '<span class="gp dead">·</span>';
      if (!pl.alive) return '<span class="gp dead">✕</span>';
      const top = pl.cards[pl.cards.length - 1];
      return `<span class="gp${Engine.RED[top.suit] ? ' red' : ''}">${Engine.label(top.rank)}${top.suit}×${pl.cards.length}</span>`;
    }).join('');
    if (state.players.length > 1) {
      // leaderboard: 🏆 top score, 🥴 biggest drinker
      const ranked = state.players.slice().sort((x, y) => y.score - x.score);
      const maxD = Math.max(...state.players.map(p => p.drinks));
      $('#gameover .sub').innerHTML = ranked.map((p, k) =>
        `${k === 0 ? '🏆 ' : ''}<b>${esc(p.name)}</b> — ${p.score} pts · ${p.drinks} 🍺` +
        `${maxD > 0 && p.drinks === maxD ? ' 🥴' : ''}`).join('<br>') +
        (bonusTxt ? `<br><span style="color:#9aa4b6">end bonuses${bonusTxt}</span>` : '') +
        statsTxt;
    } else {
      $('#gameover .sub').innerHTML =
        `Score: <b>${state.score}</b>${bonusTxt}<br>` +
        `This game: <b>${state.drinks}</b> drink${state.drinks === 1 ? '' : 's'}<br>` +
        `Session total: <b>${sessionDrinks[state.players[0].name] || 0}</b>` +
        statsTxt;
    }
    $('#gameover').classList.add('show');
  }

  function applyResult(i, result) {
    const state = cur();
    const actor = state.players[result.player];
    if (!result.win) sessionDrinks[actor.name] = (sessionDrinks[actor.name] || 0) + 1;
    if (result.win) Sfx.win(state.streak.n);
    else if (result.tie) Sfx.tie();
    else Sfx.bust();
    render({ pile: i, win: result.win, anim: true, dead: !result.win && !result.tie });
    if (result.win) {
      setTimeout(() => { render(); maybeGameOver(); }, 450);
    } else {
      showToast(result.sips, result.tie, state.players.length > 1 ? actor.name : null);
    }
  }

  function onGuess(i, dir) {
    if (locked || cur().over) return;
    if (mode === 'live') { // arm/disarm — the physical card resolves it
      if (cur().phase !== 'play' || !cur().piles[i].alive) return;
      armed = armed && armed.pile === i && armed.dir === dir ? null : { pile: i, dir };
      render();
      return;
    }
    const result = Engine.guess(vState, i, dir);
    if (!result) return;
    applyResult(i, result);
  }

  function reset() {
    if (mode === 'live') { lState = Engine.newLive(roster); armed = null; gate.frames = []; }
    else vState = Engine.newGame(null, nate, werner, roster);
    $('#gameover').classList.remove('show');
    toast.classList.remove('show');
    locked = false;
    render();
  }

  function updateRules() {
    if (mode === 'live') {
      $('#rules').textContent = 'real deck · scan flips · undo fixes misreads · works best flat to the camera, torch on at night';
      return;
    }
    const bits = [nate
      ? '😎 face-down deal · tap a pile to flip it · no odds, no hints · clear the deck for +1500'
      : '▲/▼ on any live pile · wrong = drink the pile & it dies · tie = drink, pile lives · Ace high'];
    if (werner) bits.push('🤪 stuck with your pile till it busts');
    $('#rules').textContent = bits.join(' · ');
  }

  function toggleVariant(which) {
    if (which === 'nate') nate = !nate;
    else werner = !werner;
    $('#nateBtn').classList.toggle('on', nate);
    $('#wernerBtn').classList.toggle('on', werner);
    if (mode === 'live') { setMode('play'); } // variants are virtual-deck games
    reset(); // switching always deals a fresh game
    updateRules();
  }

  function onFlip(i) {
    if (locked || mode !== 'play') return;
    if (Engine.flip(vState, i)) { Sfx.flip(); render({ pile: i, anim: true }); }
  }

  // ---- players editor (pass-and-play) ----
  function openPlayers() {
    $('#plist').innerHTML = roster.map((n) =>
      `<div class="prow"><input maxlength="12" value="${esc(n)}"><button class="pdel">✕</button></div>`).join('');
    $('#playersOv').classList.add('show');
  }

  function applyRoster(names) {
    const seen = {};
    roster = (names || []).map(n => String(n).trim()).filter(Boolean).slice(0, 8)
      .map(n => { let m = n, k = 2; while (seen[m]) m = `${n} ${k++}`; seen[m] = 1; return m; });
    if (!roster.length) roster = ['You'];
    $('#playersOv').classList.remove('show');
    reset(); // a new roster always deals a fresh game
  }

  $('#addPlayer').addEventListener('click', () => {
    if ($('#plist').children.length >= 8) return;
    const row = document.createElement('div');
    row.className = 'prow';
    row.innerHTML = '<input maxlength="12" value=""><button class="pdel">✕</button>';
    $('#plist').appendChild(row);
    row.querySelector('input').focus();
  });
  $('#plist').addEventListener('click', (e) => {
    const del = e.target.closest('.pdel');
    if (del && $('#plist').children.length > 1) del.closest('.prow').remove();
  });
  $('#playersDone').addEventListener('click', () => {
    applyRoster([...$('#plist').querySelectorAll('input')].map(el => el.value));
  });
  $('#playersOv').addEventListener('click', (e) => {
    if (e.target === $('#playersOv')) $('#playersOv').classList.remove('show'); // backdrop = cancel
  });
  $('#editPlayers').addEventListener('click', openPlayers);
  $('#turnStrip').addEventListener('click', openPlayers);
  $('#drinkStat').addEventListener('click', openPlayers);

  // ---- victory confetti: pure canvas, ~2.5s, no libs ----
  function confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = $('#confetti');
    c.width = c.clientWidth; c.height = c.clientHeight;
    const ctx = c.getContext('2d');
    const COLORS = ['#ffc53d', '#3ddc84', '#7fd6ff', '#ff6b74', '#f2f4f8'];
    const parts = Array.from({ length: 80 }, () => ({
      x: Math.random() * c.width, y: -20 - Math.random() * c.height * 0.3,
      vx: (Math.random() - 0.5) * 2.4, vy: 2 + Math.random() * 3,
      s: 5 + Math.random() * 6, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
      col: COLORS[(Math.random() * COLORS.length) | 0],
    }));
    const t0 = performance.now();
    (function tick(t) {
      ctx.clearRect(0, 0, c.width, c.height);
      for (const p of parts) {
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.r);
        ctx.fillStyle = p.col;
        ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
        ctx.restore();
      }
      if (t - t0 < 2600 && $('#gameover').classList.contains('show')) requestAnimationFrame(tick);
      else ctx.clearRect(0, 0, c.width, c.height);
    })(t0);
  }

  // ---- share the result (Web Share API, clipboard fallback) ----
  function shareText() {
    const state = cur();
    const k = modeKey(state);
    const tag = { nate: '😎 Nate mode', werner: '🤪 Werner mode',
                  'nate+werner': '😎🤪 Nate + Werner', live: '📷 live deck' }[k] || '';
    const top = state.players.slice().sort((a, b) => b.score - a.score)[0];
    const who = state.players.length > 1 ? `${top.name}: ` : '';
    const end = state.reason === 'deck' ? 'deck cleared 🎉' : 'all piles dead 💀';
    return `🍺 Higher/Lower — ${who}${top.score} pts · ${state.drinks} drinks · ${end}` +
           `${tag ? ' · ' + tag : ''}\n${SITE}`;
  }
  $('#shareBtn').addEventListener('click', () => {
    const text = shareText();
    if (navigator.share) {
      navigator.share({ text }).catch(() => {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
        $('#shareBtn').textContent = '✅ Copied';
        setTimeout(() => { $('#shareBtn').textContent = '📤 Share'; }, 1500);
      }).catch(() => {});
    }
  });

  function paintMute() {
    $('#muteBtn').textContent = Sfx.muted ? '🔇' : '🔊';
    $('#muteBtn').classList.toggle('muted', Sfx.muted);
  }
  $('#muteBtn').addEventListener('click', () => { Sfx.toggle(); paintMute(); });
  paintMute();

  // ---- Live mode: camera + acceptance gate ----
  const video = $('#camVideo');
  const overlay = $('#camOverlay');
  const gate = { frames: [] };  // per-card temporal voting replaces a confirm tap
  let stream = null, camTimer = null, workCanvas = null;

  function camMsg(text) {
    const el = $('#camMsg');
    el.textContent = text || '';
    el.classList.toggle('show', !!text);
  }

  async function startCam() {
    camMsg('');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      camMsg('No camera API here — open this page in your phone browser (HTTPS).');
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false,
      });
    } catch (e) {
      camMsg(e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')
        ? 'Camera blocked. Allow camera access for this site, or host the file over HTTPS.'
        : 'Camera unavailable: ' + (e && e.name || e));
      return;
    }
    video.srcObject = stream;
    try { await video.play(); } catch (_) {}
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.torch) {
      const btn = $('#torchBtn');
      btn.hidden = false;
      let on = false;
      btn.onclick = () => {
        on = !on;
        track.applyConstraints({ advanced: [{ torch: on }] }).catch(() => {});
      };
    }
    camTimer = setInterval(camTick, 320);
  }

  function stopCam() {
    clearInterval(camTimer); camTimer = null;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    camMsg('');
  }

  function camTick() {
    if (!video.videoWidth) return;
    if (!workCanvas) workCanvas = document.createElement('canvas');
    const w = 640, h = Math.round(640 * video.videoHeight / video.videoWidth);
    workCanvas.width = w; workCanvas.height = h;
    const ctx = workCanvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(video, 0, 0, w, h);
    processFrame(ctx.getImageData(0, 0, w, h));
  }

  function drawOverlay(outs, w, h) {
    overlay.width = overlay.clientWidth; overlay.height = overlay.clientHeight;
    const ctx = overlay.getContext('2d');
    ctx.clearRect(0, 0, overlay.width, overlay.height);
    if (!outs || !outs.length) return;
    // object-fit: cover mapping
    const s = Math.max(overlay.width / w, overlay.height / h);
    const ox = (overlay.width - w * s) / 2, oy = (overlay.height - h * s) / 2;
    ctx.font = '900 20px system-ui';
    for (const out of outs) {
      ctx.strokeStyle = out.read ? '#3ddc84' : '#ffc53d';
      ctx.lineWidth = 3;
      ctx.beginPath();
      out.quad.forEach(([x, y], i) => ctx[i ? 'lineTo' : 'moveTo'](x * s + ox, y * s + oy));
      ctx.closePath();
      ctx.stroke();
      if (out.read) {
        ctx.fillStyle = '#3ddc84';
        ctx.fillText(out.read.rank + out.read.suit, out.quad[0][0] * s + ox + 4, out.quad[0][1] * s + oy + 22);
      }
    }
  }

  const RANK_NUM = { J: 11, Q: 12, K: 13, A: 14 };
  function processFrame(img) {
    const outs = Vision.detectAll(img.data, img.width, img.height);
    drawOverlay(outs, img.width, img.height);
    feed(outs.map(o => o.read).filter(Boolean));
    return outs;
  }

  // Per-card temporal voting over the whole table: a card is accepted once the
  // same read shows up in 3 of the last 5 frames. Already-seen cards come back
  // from the engine as dups, so re-accepting is harmless — no cool-down needed.
  function feed(reads) {
    gate.frames.push(new Set(reads.map(r => r.rank + r.suit)));
    if (gate.frames.length > 5) gate.frames.shift();
    for (const r of reads) {
      const k = r.rank + r.suit;
      if (gate.frames.filter(s => s.has(k)).length >= 3) accept(r.rank, r.suit);
    }
  }

  function accept(rankLabel, suit) {
    const state = lState;
    if (!state || state.over || locked) return;
    const rank = RANK_NUM[rankLabel] || parseInt(rankLabel, 10);
    if (!rank) return;
    let res = null;
    if (state.phase === 'setup') {
      res = Engine.liveSetup(state, rank, suit);
      if (res && !res.dup) {
        flashRead(res.card, res.done ? '— all set, play!' : `→ pile ${res.pile + 1}`);
        render();
      }
      return;
    }
    if (!armed) return; // reading table noise with no guess armed — ignore
    res = Engine.liveResolve(state, armed.pile, armed.dir, rank, suit);
    if (!res || res.dup) return;
    const i = armed.pile;
    armed = null;
    flashRead(res.card, res.win ? '— win' : res.tie ? '— tie' : '');
    applyResult(i, res);
  }

  function undo() {
    if (mode !== 'live' || !lState) return;
    const before = lState.players.map(p => p.drinks);
    if (!Engine.liveUndo(lState)) return;
    lState.players.forEach((p, k) => {
      const d = before[k] - p.drinks;
      if (d > 0) sessionDrinks[p.name] = Math.max(0, (sessionDrinks[p.name] || 0) - d);
    });
    armed = null;
    gate.frames = [];
    $('#gameover').classList.remove('show');
    render();
  }

  function setMode(m) {
    if (m === mode) return;
    mode = m;
    armed = null;
    const live = mode === 'live';
    $('#cam').classList.toggle('show', live);
    $('#modeBtn').classList.toggle('live', live);
    $('#modeBtn').textContent = live ? '🎴 Play' : '📷 Live';
    updateRules();
    $('#gameover').classList.remove('show');
    if (live) {
      if (!lState) lState = Engine.newLive();
      startCam();
    } else {
      stopCam();
    }
    render();
  }

  grid.addEventListener('click', (e) => {
    const back = e.target.closest('.card.back');
    if (back) { onFlip(+back.dataset.flip); return; }
    const btn = e.target.closest('.guess');
    if (btn) onGuess(+btn.dataset.i, btn.dataset.dir);
  });
  $('#newgame').addEventListener('click', reset);
  $('#nateBtn').addEventListener('click', () => toggleVariant('nate'));
  $('#wernerBtn').addEventListener('click', () => toggleVariant('werner'));
  $('#again').addEventListener('click', reset);
  $('#undoBtn').addEventListener('click', undo);
  $('#modeBtn').addEventListener('click', () => setMode(mode === 'live' ? 'play' : 'live'));

  render();
  // test hooks
  window.__game = { get state() { return vState; }, Engine, reset, onGuess,
                    setRoster: applyRoster, openPlayers,
                    refresh: () => { render(); maybeGameOver(); } };
  window.__live = {
    get state() { return lState; }, get mode() { return mode; }, get armed() { return armed; },
    setMode, feed, accept, undo, processFrame, Vision,
  };
})();
</script>
</body>
</html>
